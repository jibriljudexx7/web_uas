name: Deploy Web Statis

on:
  push:
    branches:
      - main
    paths:
      - 'web-statis/**'
      - '.github/workflows/deploy-statis.yml'

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web-statis
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/uas-statis:latest

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          envs: DOCKERHUB_USERNAME
          script: |
            cd /home/${{ secrets.AWS_USERNAME }}/uas-project/web-dinamis
            export DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME
            docker compose pull
            docker compose up -d --force-recreate
            echo "✅ Web Statis deployed successfully via Docker Compose"